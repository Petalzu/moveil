<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨隐 MoVeil · 本地审查</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="app-header"><h1 class="brand">◈ 墨隐 MoVeil</h1><span class="subtitle">NVIDIA GLiNER-PII · 隐私编辑工作台</span><button id="toggle-data" aria-controls="data-panel" aria-expanded="true">收起数据</button></header>
<main id="workspace" class="workspace">
	<aside id="data-panel" class="sidebar" aria-label="任务与数据">
		<section class="runner">
			<h2>样例处理</h2>
			<div class="run-controls"><label for="count">数量</label><select id="count"></select><button id="start" class="primary">开始样例测试</button></div>
			<details class="upload-panel" open><summary>自定义图片</summary><label class="file-picker" for="upload-file">选择图片<input id="upload-file" type="file" accept="image/png,image/jpeg,image/webp"></label><p id="file-name" class="hint">PNG / JPEG / WebP · 最大 10 MB · 1600 万像素</p><button id="upload" disabled>上传并识别</button><p id="upload-status" role="status"></p></details>
			<p id="progress-text" role="status">选择数量后开始运行</p><progress id="progress" value="0" max="10"></progress>
		</section>
		<section id="scores" class="scores" aria-label="评测指标"></section>
		<p id="metrics" role="status"></p>
		<section id="inspector" hidden>
			<details id="match-section"><summary>实体匹配明细</summary><div id="matches" class="matches"></div></details>
			<details class="detection-section"><summary>检测详情</summary><div id="detections" class="matches"></div></details>
			<p id="version"></p>
		</section>
	</aside>
	<section class="editor" aria-label="图片编辑工作区">
		<section class="editor-tools" aria-label="编辑工具">
			<div class="toolbar"><label><input id="boxes" type="checkbox" checked> 框</label><label><input id="labels" type="checkbox" checked> 标签</label><label for="view-mode" class="sr-only">图片显示比例</label><select id="view-mode"><option value="fit">适应窗口</option><option value="width">铺满宽度</option><option value="actual">原始尺寸</option></select><button id="undo" disabled>撤销补框</button><button id="save" class="primary" disabled>保存新版本</button><a id="download" href="/download" download="redacted.png" hidden>下载处理图</a></div>
			<p id="status" role="status">在任一图片上拖动补框 · 紫色框为待保存修改</p>
		</section>
		<section class="navigation"><nav class="pager" aria-label="样例分页"><button id="previous" aria-label="上一张">←</button><div id="pages" role="tablist"></div><button id="next" aria-label="下一张">→</button></nav><p id="sample-info"></p></section>
		<div class="stage"><p id="empty">选择样例或上传图片，开始编辑。</p><section id="sample" data-view="fit" hidden>
			<article class="image-card"><div class="image-heading"><h2>01 / 原图</h2><span>查看原始内容 · 拖动补框</span></div><div class="canvas-viewport" tabindex="0" role="region" aria-label="原图视口，可滚动"><canvas id="original" aria-label="原图：拖动绘制补遮挡矩形"></canvas></div></article>
			<article class="image-card"><div class="image-heading"><h2>02 / 处理图</h2><span>对照遮挡效果 · 同步编辑</span></div><div class="canvas-viewport" tabindex="0" role="region" aria-label="处理图视口，可滚动"><canvas id="result" aria-label="处理图：拖动绘制补遮挡矩形"></canvas></div></article>
		</section></div>
	</section>
</main>
</body></html>
